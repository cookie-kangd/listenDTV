name: Build listenDTV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10 (required by Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1
          set +e
          # API 37 platforms are published as 37.x (preview) in non-stable channels.
          # Install the concrete 37.x platform; AGP resolves compileSdk by SDK level.
          PLAT=0
          for pkg in "platforms;android-37.2" "platforms;android-37.0" "platforms;android-37.1"; do
            for ch in stable 1 2; do
              if [ "$ch" = "stable" ]; then
                sdkmanager "$pkg" >/dev/null 2>&1 && { PLAT=1; break 2; }
              else
                sdkmanager --channel=$ch "$pkg" >/dev/null 2>&1 && { PLAT=1; break 2; }
              fi
            done
          done
          BT=""
          for b in 37.0.0 36.0.0 35.0.0; do
            sdkmanager "build-tools;$b" >/dev/null 2>&1 && { BT=$b; break; }
          done
          sdkmanager "platform-tools" >/dev/null 2>&1
          # Prefer a preinstalled NDK compatible with Chaquopy 17 (r25-r27)
          NDK_HOME=""
          if [ -d "$ANDROID_HOME/ndk/27.3.13750724" ]; then NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          elif [ -d "$ANDROID_HOME/ndk/25.2.9519653" ]; then NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          else
            for n in 27.3.13750724 25.2.9519653; do
              sdkmanager "ndk;$n" >/dev/null 2>&1 && { NDK_HOME=$(ls -d $ANDROID_HOME/ndk/$n 2>/dev/null | head -1); [ -n "$NDK_HOME" ] && break; }
            done
          fi
          set -e
          # Ensure canonical android-37 dir exists for AGP
          if [ -d "$ANDROID_HOME/platforms" ]; then
            pushd "$ANDROID_HOME/platforms" >/dev/null
            for d in android-37.*; do
              if [ -d "$d" ] && [ ! -e android-37 ]; then
                ln -s "$d" android-37
                echo "linked android-37 -> $d"
              fi
            done
            popd >/dev/null
          fi
          echo "PLAT=$PLAT BT=$BT NDK_HOME=$NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          sdkmanager --list_installed 2>/dev/null | grep -i platform

      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias listenDTV \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=listenDTV, OU=Dev, O=listenDTV, L=Unknown, S=Unknown, C=CN"
          {
            echo "storeFile=release.keystore"
            echo "keyAlias=listenDTV"
            echo "keyPassword=android"
            echo "storePassword=android"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleLeanbackRelease assembleMobileRelease --no-daemon --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs -name '*.apk' -print

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listenDTV-apks
          path: app/build/outputs/**/*.apk
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: false
          files: app/build/outputs/apk/**/*.apk
