name: Build listenDTV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
  MEDIA3_REF: "release-1.11.0-fongmi"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout FongMi Media3 source
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: release-1.11.0-fongmi
          path: .media3
          fetch-depth: 1

      - name: Limit Media3 composite modules
        run: cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts

      - name: Align Media3 AGP version with app (single AGP version required)
        run: |
          sed -i -E 's/^(androidGradlePlugin = ")[0-9.]+(")/\19.3.1\2/' .media3/gradle/libs.versions.toml
          grep -n "androidGradlePlugin" .media3/gradle/libs.versions.toml

      - name: Inject secondary-subtitle no-op shims into .media3
        run: python3 .github/patch-media3-secondary.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10 (required by Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1
          set +e
          # API 37 platforms are published as 37.x (preview) in non-stable channels.
          PLAT=0
          for pkg in "platforms;android-37.2" "platforms;android-37.0" "platforms;android-37.1"; do
            for ch in stable 1 2; do
              if [ "$ch" = "stable" ]; then
                sdkmanager "$pkg" >/dev/null 2>&1 && { PLAT=1; break 2; }
              else
                sdkmanager --channel=$ch "$pkg" >/dev/null 2>&1 && { PLAT=1; break 2; }
              fi
            done
          done
          BT=""
          for b in 37.0.0 36.0.0 35.0.0; do
            sdkmanager "build-tools;$b" >/dev/null 2>&1 && { BT=$b; break; }
          done
          sdkmanager "platform-tools" >/dev/null 2>&1
          sdkmanager "cmake;3.31.6" >/dev/null 2>&1
          NDK_HOME=""
          if [ -d "$ANDROID_HOME/ndk/27.3.13750724" ]; then NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          elif [ -d "$ANDROID_HOME/ndk/25.2.9519653" ]; then NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          else
            for n in 27.3.13750724 25.2.9519653; do
              sdkmanager "ndk;$n" >/dev/null 2>&1 && { NDK_HOME=$(ls -d $ANDROID_HOME/ndk/$n 2>/dev/null | head -1); [ -n "$NDK_HOME" ] && break; }
            done
          fi
          set -e
          # Ensure canonical android-37 dir exists for AGP
          if [ -d "$ANDROID_HOME/platforms" ]; then
            pushd "$ANDROID_HOME/platforms" >/dev/null
            for d in android-37.*; do
              if [ -d "$d" ] && [ ! -e android-37 ]; then
                ln -s "$d" android-37
                echo "linked android-37 -> $d"
              fi
            done
            popd >/dev/null
          fi
          echo "PLAT=$PLAT BT=$BT NDK_HOME=$NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          sdkmanager --list_installed 2>/dev/null | grep -i platform

      - name: Prepare signing config (keystore is committed for stable OTA signatures)
        run: |
          {
            echo "storeFile=release.keystore"
            echo "keyAlias=listenDTV"
            echo "keyPassword=android"
            echo "storePassword=android"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          ls -la app/release.keystore

      - name: Build release APKs
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
        run: |
          chmod +x gradlew
          ./gradlew assembleLeanbackRelease assembleMobileRelease --no-daemon --stacktrace \
            --init-script .github/annotations-force.init.gradle

      - name: List APKs
        if: always()
        run: find app/build/outputs -name '*.apk' -print

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listenDTV-apks
          path: app/build/outputs/**/*.apk
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: false
          files: app/build/outputs/apk/**/*.apk
