name: Build listenDTV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
  MEDIA3_REF: "release-1.11.0-fongmi"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Validate release notes (short, current version only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          bytes=$(wc -c < RELEASE_NOTES.md)
          lines=$(wc -l < RELEASE_NOTES.md)
          headings=$(grep -c '^# ' RELEASE_NOTES.md || true)
          echo "RELEASE_NOTES.md: ${bytes} bytes / ${lines} lines / ${headings} headings"
          if [ "$bytes" -gt 1000 ] || [ "$lines" -gt 12 ] || [ "$headings" -gt 1 ]; then
            echo "::error::Release notes must contain ONLY this version's short change list (<=1000 bytes, <=12 lines, one heading)."
            exit 1
          fi

      - name: Checkout FongMi Media3 source
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: release-1.11.0-fongmi
          path: .media3
          fetch-depth: 1

      - name: Limit Media3 composite modules
        run: cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts

      - name: Align Media3 AGP version with app (single AGP version required)
        run: |
          sed -i -E 's/^(androidGradlePlugin = ")[0-9.]+(")/\19.3.1\2/' .media3/gradle/libs.versions.toml
          grep -n "androidGradlePlugin" .media3/gradle/libs.versions.toml

      - name: Inject secondary-subtitle no-op shims into .media3
        run: python3 .github/patch-media3-secondary.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10 (required by Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/fongmi' && github.event_name != 'push' }}
          # caches ~/.gradle/caches + wrapper: dependency downloads, build-cache-1
          # (media3 composite task outputs) and transforms persist between runs

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1
          set +e
          # API 37 platforms are published as 37.x (preview) in non-stable channels.
          PLAT=0
          for pkg in "platforms;android-37.2" "platforms;android-37.0" "platforms;android-37.1"; do
            for ch in stable 1 2; do
              if [ "$ch" = "stable" ]; then
                sdkmanager "$pkg" >/dev/null 2>&1 && { PLAT=1; break 2; }
              else
                sdkmanager --channel=$ch "$pkg" >/dev/null 2>&1 && { PLAT=1; break 2; }
              fi
            done
          done
          BT=""
          for b in 37.0.0 36.0.0 35.0.0; do
            sdkmanager "build-tools;$b" >/dev/null 2>&1 && { BT=$b; break; }
          done
          sdkmanager "platform-tools" >/dev/null 2>&1
          sdkmanager "cmake;3.31.6" >/dev/null 2>&1
          NDK_HOME=""
          if [ -d "$ANDROID_HOME/ndk/27.3.13750724" ]; then NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          elif [ -d "$ANDROID_HOME/ndk/25.2.9519653" ]; then NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          else
            for n in 27.3.13750724 25.2.9519653; do
              sdkmanager "ndk;$n" >/dev/null 2>&1 && { NDK_HOME=$(ls -d $ANDROID_HOME/ndk/$n 2>/dev/null | head -1); [ -n "$NDK_HOME" ] && break; }
            done
          fi
          set -e
          # Ensure canonical android-37 dir exists for AGP
          if [ -d "$ANDROID_HOME/platforms" ]; then
            pushd "$ANDROID_HOME/platforms" >/dev/null
            for d in android-37.*; do
              if [ -d "$d" ] && [ ! -e android-37 ]; then
                ln -s "$d" android-37
                echo "linked android-37 -> $d"
              fi
            done
            popd >/dev/null
          fi
          echo "PLAT=$PLAT BT=$BT NDK_HOME=$NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          sdkmanager --list_installed 2>/dev/null | grep -i platform

      - name: Prepare signing config (keystore is committed for stable OTA signatures)
        run: |
          {
            echo "storeFile=release.keystore"
            echo "keyAlias=listenDTV"
            echo "keyPassword=android"
            echo "storePassword=android"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          ls -la app/release.keystore

      - name: Build release APKs
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
        run: |
          chmod +x gradlew
          ./gradlew assembleLeanbackRelease assembleMobileRelease --no-daemon --stacktrace \
            --init-script .github/annotations-force.init.gradle

      - name: List APKs
        if: always()
        run: find app/build/outputs -name '*.apk' -print

      - name: Upload APK artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: listenDTV-apks
          path: app/build/outputs/**/*.apk
          if-no-files-found: warn

      - name: Collect and verify release APKs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          EXPECTED="${TAG_VERSION#v}"
          rm -rf release-assets && mkdir -p release-assets
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1 || true)"
          echo "aapt2: ${AAPT2:-not found}"
          for name in leanback-arm64_v8a.apk leanback-armeabi_v7a.apk mobile-arm64_v8a.apk mobile-armeabi_v7a.apk; do
            apk="$(find app/build/outputs/apk -type f -name "$name" -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)"
            if [ -z "$apk" ]; then
              echo "::error::Missing build output: $name"
              exit 1
            fi
            echo "Collecting $apk"
            cp "$apk" "release-assets/$name"
            if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
              manifest="$("$AAPT2" dump xmltree --file AndroidManifest.xml "release-assets/$name" 2>/dev/null | grep -E 'versionCode|versionName' || true)"
              echo "  version info: ${manifest:-<unavailable>}"
              if [ -n "$manifest" ] && ! echo "$manifest" | grep -q "versionName.*\"$EXPECTED\""; then
                echo "::error::$name versionName does not match tag $TAG_VERSION -- refusing to publish a stale APK"
                exit 1
              fi
            fi
          done
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt

      - name: Remove old releases (only the latest one stays)
        if: startsWith(github.ref, 'refs/tags/') && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            echo "Deleting old release $tag"
            gh release delete "$tag" --yes || echo "Could not delete $tag"
          done
          echo "Remaining releases:"
          gh release list --limit 100
