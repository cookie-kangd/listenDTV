// Fix composite-build classpath conflict: Gradle 9.7.1 pins org.jetbrains:annotations
// to {strictly 13.0} (embedded Kotlin), while FongMi/media's build-logic (AGP 9.0.1
// via ddmlib/layoutlib-api) requires 23.0.0. Force 13.0 to align with the pin.
buildscript {
    configurations.classpath {
        resolutionStrategy {
            force 'org.jetbrains:annotations:13.0'
        }
    }
}

plugins {
    alias libs.plugins.android.application apply false
    alias libs.plugins.android.library apply false
    alias libs.plugins.chaquo.python apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
